<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIMPUS Sehat – Sistem Informasi Puskesmas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap">
<style>
:root{--ink:#12303a;--mute:#5d7580;--bg:#eef5f3;--surf:#fff;--line:#d3e2de;--teal:#1b7f79;--teal-d:#0f5c58;--red:#c8453b;--amb:#b7791f;--ok:#2f855a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e3f0ee;--mute:#93aeb3;--bg:#0d1d21;--surf:#14292e;--line:#264249;--teal:#3fb8af;--teal-d:#7fd8d0;--red:#f0786e;--amb:#e5b25d;--ok:#6fcf97;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#e3f0ee;--mute:#93aeb3;--bg:#0d1d21;--surf:#14292e;--line:#264249;--teal:#3fb8af;--teal-d:#7fd8d0;--red:#f0786e;--amb:#e5b25d;--ok:#6fcf97;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:#0f5c58;color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
:root[data-theme="dark"] nav,:root:not([data-theme="light"]) nav{--x:0}
nav h1{font-size:19px;font-weight:800;margin:0 8px 2px;letter-spacing:-.3px}
nav small{margin:0 8px 18px;opacity:.75;display:block}
nav a{color:#fff;text-decoration:none;padding:9px 12px;border-radius:8px;opacity:.85;display:block}
nav a.on,nav a:hover{background:rgba(255,255,255,.16);opacity:1;font-weight:600}
nav .who{margin-top:auto;font-size:13px;padding:10px 8px;border-top:1px solid rgba(255,255,255,.25)}
nav button{background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;margin-top:6px}
main{padding:26px clamp(16px,3vw,36px);max-width:1100px;width:100%}
h2{font-size:24px;margin:0 0 4px;letter-spacing:-.4px;font-weight:800}
.sub{color:var(--mute);margin:0 0 20px}
.stats{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);border-radius:12px;background:var(--surf);margin-bottom:20px;overflow:hidden}
.stats div{flex:1 1 140px;padding:16px 18px;border-right:1px solid var(--line)}
.stats b{font-size:30px;display:block;font-weight:800;color:var(--teal)}
.stats span{color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:3fr 2fr;gap:18px}
.box{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
.box h3{margin:0 0 12px;font-size:16px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mute);font-weight:600;padding:8px;border-bottom:2px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}
label{display:block;font-weight:600;font-size:13px;margin:10px 0 4px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 14px}
.btn{background:var(--teal);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer}
:root[data-theme="dark"] .btn{color:#06201e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#06201e}}
.btn.alt{background:transparent;color:var(--teal);border:1px solid var(--teal)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.del{background:var(--red);color:#fff}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid currentColor}
.Menunggu,.Pending{color:var(--amb)}.Diperiksa{color:var(--teal)}.Selesai,.Aktif,.Aman{color:var(--ok)}.Nonaktif,.Menipis{color:var(--red)}.ck{display:flex;gap:8px;align-items:center;font-weight:400;margin-top:8px}.ck input{width:auto}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:8px}
.bars div{flex:1;text-align:center;font-size:12px;color:var(--mute);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;background:var(--teal);border-radius:5px 5px 0 0;min-height:3px}
.bars em{font-style:normal;color:var(--ink);font-weight:600}
.dx{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.login{max-width:380px;margin:12vh auto;padding:0 18px}
.login .box{padding:26px}
.hint{font-size:12.5px;color:var(--mute);margin-top:12px}
.err{color:var(--red);font-size:13px;margin-top:8px}
.toast{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:9}
.empty{color:var(--mute);padding:14px 0}
.vit{display:flex;gap:16px;flex-wrap:wrap;color:var(--mute);font-size:13px}
.tl{border-left:3px solid var(--teal);padding-left:14px;margin:0 0 16px 6px}
@media (max-width:820px){.wrap{grid-template-columns:1fr}nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}nav small,nav .who{display:none}.grid{grid-template-columns:1fr}}
.topbar{display:flex;justify-content:flex-end;align-items:center;gap:12px;padding:10px clamp(16px,3vw,36px);border-bottom:1px solid var(--line);background:var(--surf);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;font-size:14px;color:var(--mute)}.topbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wrap>div{min-width:0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:20;padding:16px}.ov .box{max-width:380px;width:100%;margin:0}
.intro{position:fixed;inset:0;background:#0f5c58;color:#fff;display:grid;place-items:center;padding:22px;z-index:30;overflow:auto}
.ib{max-width:430px;width:100%}.logo{width:56px;height:56px;border-radius:14px;background:#fff;color:#0f5c58;font:800 34px/56px sans-serif;text-align:center;margin-bottom:18px}
.intro h1{font-size:30px;margin:0 0 4px;letter-spacing:-.6px;font-weight:800;line-height:1.15}.intro p{margin:0;opacity:.8}
.intro ul{list-style:none;padding:0;margin:24px 0 12px}.intro li{opacity:.35;padding:4px 0;transition:opacity .3s}.intro li.on{opacity:1}.intro li.on::before{content:"\2713  "}
.bar{height:4px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#fff;transition:width .5s}
.tour{margin-top:22px;background:rgba(255,255,255,.12);border-radius:12px;padding:16px 18px}.tour b{display:block;margin-bottom:6px}.tour li{opacity:1;padding:3px 0}.tour li::before{content:"\2022  "}
.lnk{background:none;border:0;color:#fff;opacity:.8;text-decoration:underline;cursor:pointer;margin-top:14px;padding:4px 0}
@media (prefers-reduced-motion:reduce){.bar i,.intro li{transition:none}}
body.ps main>*:not(#sks){display:none!important}
@media print{nav,.noprint{display:none!important}.wrap{display:block}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const mem={};
const S={get(k){try{const r=localStorage.getItem(k);if(r)return JSON.parse(r)}catch(e){}return mem[k]||null},
set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dstr=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const today=dstr(0);
const ROLE={admin:'Administrator',petugas:'Petugas pendaftaran',dokter:'Dokter',pasien:'Pasien'};
const MENU={pasien:[['beranda','Beranda'],['antrean','Ambil antrean'],['riwayat','Riwayat kunjungan'],['datasaya','Data saya'],['info','Info puskesmas']],
admin:[['dashboard','Dashboard'],['pengguna','Manajemen pengguna'],['obat','Stok obat'],['log','Log aktivitas'],['pengaturan','Pengaturan'],['statistik','Statistik'],['laporan','Laporan']],
petugas:[['dashboard','Dashboard'],['pasien','Data pasien'],['daftar','Pendaftaran & antrean'],['statistik','Statistik'],['laporan','Laporan']],
dokter:[['dashboard','Dashboard'],['periksa','Pemeriksaan'],['rekam','Rekam medis'],['obat','Stok obat'],['statistik','Statistik'],['laporan','Laporan']]};
const $=id=>document.getElementById(id);
const byPri=(a,b)=>(a.status==='Selesai')-(b.status==='Selesai')||(!!b.darurat)-(!!a.darurat)||a.id-b.id;
const setTheme=t=>{if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=t;S.set('simpus_theme',t)};
const hb=rows=>{const mx=Math.max(...rows.map(r=>r[1]),1);return rows.map(r=>`<div style="margin:9px 0"><div class="dx" style="border:0;padding:0"><span>${esc(r[0])}</span><b>${r[1]}</b></div><div style="height:8px;background:var(--line);border-radius:4px"><i style="display:block;height:100%;width:${r[1]/mx*100}%;background:var(--teal);border-radius:4px"></i></div></div>`).join('')||'<p class="empty">Belum ada data.</p>'};
const fmt=d=>d.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
const CFG={nama:'Puskesmas Rawat Jalan',alamat:'Jl. Kesehatan No. 1, Pekanbaru',jam:'Senin–Sabtu, 08.00–14.00'};
function dlg(msg,o={}){return new Promise(r=>{const d=document.createElement('div');d.className='ov';
 d.innerHTML=`<div class="box" role="dialog" aria-modal="true"><p>${esc(msg).replace(/\n/g,'<br>')}</p>${o.input?`<input id="dli" type="${o.type||'text'}" value="${esc(o.def||'')}">`:''}<p style="display:flex;gap:8px;justify-content:flex-end;margin:12px 0 0">${o.info?'':'<button class="btn alt" id="dlc">Batal</button>'}<button class="btn" id="dlo">${o.ok||'OK'}</button></p></div>`;
 document.body.appendChild(d);d.querySelector('input,#dlo').focus();const end=v=>{d.remove();r(v)};
 d.querySelector('#dlo').onclick=()=>end(o.input?d.querySelector('#dli').value:true);const c=d.querySelector('#dlc');if(c)c.onclick=()=>end(o.input?null:false);
 d.onkeydown=e=>{if(e.key==='Escape')end(o.input?null:false);if(e.key==='Enter')d.querySelector('#dlo').click()}})}
const pwOk=p=>p.length>=8&&/[a-zA-Z]/.test(p)&&/\d/.test(p);
const hx=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const legacy=async p=>{try{return hx(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('simpus:'+p)))}catch(e){return 'x'+btoa(unescape(encodeURIComponent(p)))}};
const pbk=async(p,salt)=>{const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);return hx(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode(salt),iterations:150000},k,256))};
const hash=async p=>{try{const salt=hx(crypto.getRandomValues(new Uint8Array(16)));return 'pb:'+salt+':'+await pbk(p,salt)}catch(e){return legacy(p)}};
const verify=async(a,p)=>{if(!a||!a.h)return false;if(a.h.startsWith('pb:')){const [,salt,h]=a.h.split(':');return h===await pbk(p,salt)}
 if(a.h===await legacy(p)){a.h=await hash(p);save();return true}return false};
const DX=['J06.9 ISPA','K30 Dispepsia','I10 Hipertensi','E11 Diabetes melitus tipe 2','A09 Diare','M79.1 Mialgia','L30.9 Dermatitis','R50.9 Demam'];
const POLI=['Umum','Gigi','KIA'];

function seed(){
 const p=[['3314010101800001','Siti Aminah','1980-01-01','P','Jl. Sudirman 12, Pekanbaru','081200000001','0001234567'],
 ['3314020205750002','Budi Santoso','1975-05-02','L','Jl. Soekarno-Hatta 45','081200000002','','Amoxicillin'],
 ['3314030310010003','Dewi Anggraini','2001-10-03','P','Jl. Tuanku Tambusai 8','081200000003','0007654321'],
 ['3314040412600004','Ahmad Fauzi','1960-12-04','L','Jl. Arifin Ahmad 77','081200000004','0001112223'],
 ['3314050520150005','Rafi Pratama','2015-05-20','L','Jl. Imam Munandar 5','081200000005',''],
 ['3314060615900006','Nur Hidayah','1990-06-15','P','Jl. Garuda Sakti 31','081200000006','0009998887']]
 .map((r,i)=>({id:'P'+String(i+1).padStart(3,'0'),nik:r[0],nama:r[1],lahir:r[2],jk:r[3],alamat:r[4],telp:r[5],bpjs:r[6],alergi:r[7]||''}));
 const k=[];let id=1;
 for(let d=-6;d<=0;d++){const n=2+((d+9)%3);
  for(let j=0;j<n;j++){const pid=p[(id*5+j)%6].id,poli=POLI[(id+j)%3];
   const done=d<0||j<n-1;
   k.push({id:id++,pid,tgl:dstr(d),poli,keluhan:['Batuk pilek','Nyeri ulu hati','Pusing, tensi tinggi','Lemas, sering haus','BAB cair','Pegal-pegal'][(id+j)%6],
   no:poli[0]+String(j+1).padStart(2,'0'),status:done?'Selesai':(j==n-1?'Menunggu':'Menunggu'),
   ttv:done?{td:'1'+(2+(id%3))+'0/8'+(id%3),suhu:(36.4+(id%5)*.3).toFixed(1),bb:50+id%25,nadi:72+id%15}:null,
   dx:done?DX[(id*3+j)%DX.length]:'',terapi:done?'Terapi simptomatik, edukasi, kontrol bila perlu':''});}}
 return {pasien:p,kunjungan:k,seqP:7,seqK:id};
}
let db=S.get('simpus_db')||seed();
db.obat=db.obat||[['Paracetamol 500 mg','tablet',200,50],['Amoxicillin 500 mg','kapsul',120,40],['Antasida DOEN','tablet',90,30],['Amlodipine 5 mg','tablet',60,30],['Metformin 500 mg','tablet',25,30],['ORS','sachet',40,20],['CTM 4 mg','tablet',150,40]].map((r,i)=>({id:'O'+(i+1),nama:r[0],satuan:r[1],stok:r[2],min:r[3]}));
db.seqO=db.seqO||8;db.cfg=db.cfg||CFG;db.info=db.info||{teks:'',t:''};db.log=db.log||[];S.set('simpus_db',db);
const logA=a=>{db.log.unshift({t:new Date().toISOString(),u:user?user.u:'-',a});db.log=db.log.slice(0,200);save()};
let user=null;
let toastT;
const save=()=>S.set('simpus_db',db);
const nama=id=>(db.pasien.find(p=>p.id==id)||{}).nama||'-';
const umur=l=>Math.floor((Date.now()-new Date(l))/31557600000);
function toast(m){let t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
const view=()=>(location.hash.slice(1)||'dashboard');
const doLogout=async()=>{if(!await dlg('Keluar dari akun ini?',{ok:'Logout'}))return;logA('Logout');user=null;S.set('simpus_user',null);location.hash='';render()};
let idle;const bump=()=>{clearTimeout(idle);if(user)idle=setTimeout(()=>{logA('Logout otomatis (tidak aktif)');user=null;S.set('simpus_user',null);render();toast('Sesi berakhir karena tidak aktif 15 menit')},900000)};
['click','keydown','touchstart'].forEach(e=>addEventListener(e,bump));

function login(tab='in'){
 const inn=tab==='in';
 $('app').innerHTML=`<div class="login"><div class="box"><h2>SIMPUS Sehat</h2><p class="sub">Layanan rawat jalan puskesmas. Pasien dapat mengambil antrean online.</p>
 <div style="display:flex;gap:8px"><button class="btn ${tab==='in'?'':'alt'}" id="t1">Masuk</button><button class="btn ${tab==='pt'?'':'alt'}" id="t3">Daftar pasien</button><button class="btn ${tab==='up'?'':'alt'}" id="t2">Akun staf</button></div>
 ${tab==='rs'?`<h3 style="margin:14px 0 0">Reset kata sandi pasien</h3><p class="hint" style="margin-top:4px">Verifikasi dengan data yang terdaftar di puskesmas.</p><label for="ru2">Nama pengguna</label><input id="ru2" autocomplete="username"><label for="rn2">NIK</label><input id="rn2" inputmode="numeric" maxlength="16"><label for="rl2">Tanggal lahir</label><input id="rl2" type="date"><label for="rh2">4 digit terakhir No. HP terdaftar</label><input id="rh2" inputmode="numeric" maxlength="4"><label for="rp2">Kata sandi baru (min. 8 karakter, huruf dan angka)</label><input id="rp2" type="password" autocomplete="new-password"><div class="err" id="er"></div><p><button class="btn" id="rs2">Atur ulang kata sandi</button> <button class="btn alt" id="rb2">Kembali</button></p><p class="hint">Jika No. HP belum terdaftar atau data tidak cocok, datang ke loket puskesmas dengan KTP.</p>`:tab==='pt'?`<p class="hint" style="margin:12px 0 0">Pasien baru maupun lama. Akun langsung aktif.</p><label for="qn">NIK (16 digit)</label><input id="qn" inputmode="numeric" maxlength="16"><label for="qa">Nama lengkap</label><input id="qa"><div class="row"><div><label for="ql">Tanggal lahir</label><input id="ql" type="date"></div><div><label for="qj">Jenis kelamin</label><select id="qj"><option value="P">Perempuan</option><option value="L">Laki-laki</option></select></div></div><label for="qt">No. HP</label><input id="qt" inputmode="tel"><label for="qu">Nama pengguna</label><input id="qu" autocomplete="username"><label for="qp">Kata sandi (min. 8 karakter, huruf dan angka)</label><input id="qp" type="password" autocomplete="new-password"><label for="qc">Ulangi kata sandi</label><input id="qc" type="password" autocomplete="new-password"><label class="ck"><input type="checkbox" id="qs">Saya setuju data pribadi dan data kesehatan saya diproses puskesmas untuk layanan berobat.</label><div class="err" id="er"></div><p><button class="btn" id="qg">Buat akun pasien</button></p><p class="hint">Jika NIK sudah terdaftar di puskesmas, tanggal lahir harus sama dengan data kami.</p>`:inn?`<label for="u">Nama pengguna</label><input id="u" autocomplete="username"><label for="pw">Kata sandi</label><input id="pw" type="password" autocomplete="current-password">
 <label class="ck"><input type="checkbox" id="sp">Tampilkan kata sandi</label><div class="err" id="er"></div><p><button class="btn" id="go">Masuk</button></p>
 <p class="hint">Staf: minta administrator mereset akun. <a href="#" id="lp">Pasien lupa kata sandi?</a></p>`
 :`<label for="rn">Nama lengkap</label><input id="rn"><label for="ru">Nama pengguna</label><input id="ru" autocomplete="username"><label for="rr">Peran</label><select id="rr"><option value="petugas">Petugas pendaftaran</option><option value="dokter">Dokter</option></select>
 <label for="rp">Kata sandi (min. 8 karakter, huruf dan angka)</label><input id="rp" type="password" autocomplete="new-password"><label for="rc">Ulangi kata sandi</label><input id="rc" type="password" autocomplete="new-password">
 <div class="err" id="er"></div><p><button class="btn" id="rg">Kirim pendaftaran</button></p><p class="hint">Akun aktif setelah disetujui administrator.</p>`}</div></div>`;
 $('t1').onclick=()=>login('in');$('t2').onclick=()=>login('up');$('t3').onclick=()=>login('pt');
 if(inn&&$('lp'))$('lp').onclick=e=>{e.preventDefault();login('rs')};
 if(tab==='rs'){$('rb2').onclick=()=>login('in');$('rs2').onclick=async()=>{const e=$('er'),un=$('ru2').value.trim().toLowerCase(),k='rs:'+un,f=S.get('simpus_fail')||{},x=f[k]||{n:0,until:0};
  if(x.until>Date.now())return e.textContent='Terlalu banyak percobaan. Coba lagi dalam '+Math.ceil((x.until-Date.now())/60000)+' menit.';
  const a=db.users.find(z=>z.u===un&&z.role==='pasien'),pt=a&&db.pasien.find(z=>z.id===a.pid),hp=((pt&&pt.telp)||'').replace(/\D/g,'');
  const ok=pt&&hp.length>=4&&pt.nik===$('rn2').value.trim()&&pt.lahir===$('rl2').value&&hp.slice(-4)===$('rh2').value.trim();
  if(!ok){x.n++;if(x.n>=3){x.until=Date.now()+300000;x.n=0}f[k]=x;S.set('simpus_fail',f);return e.textContent=x.until>Date.now()?'Terlalu banyak percobaan. Dikunci 5 menit.':'Data verifikasi tidak cocok. Sisa percobaan: '+(3-x.n)+'.'}
  if(!pwOk($('rp2').value))return e.textContent='Kata sandi baru minimal 8 karakter dengan huruf dan angka.';
  a.h=await hash($('rp2').value);delete f[k];S.set('simpus_fail',f);const w=user;user=a;logA('Reset sandi pasien (verifikasi data)');user=w;save();
  login('in');$('er').style.color='var(--ok)';$('er').textContent='Kata sandi diganti. Silakan masuk.'};return}
 if(tab==='pt'){$('qg').onclick=async()=>{const e=$('er'),nik=$('qn').value.trim(),n=$('qa').value.trim(),l=$('ql').value,un=$('qu').value.trim().toLowerCase(),p=$('qp').value;
  if(!/^\d{16}$/.test(nik))return e.textContent='NIK harus 16 digit angka.';
  if(n.length<3)return e.textContent='Isi nama lengkap.';

 $('ag').onclick=()=>{const poli=$('aq').value,kel=$('ak').value.trim(),e=$('ae');
  if(kel.length<3)return e.textContent='Isi keluhan utama Anda.';
  if(db.kunjungan.some(k=>k.tgl===today&&k.pid===user.pid&&k.poli===poli&&k.status!=='Selesai'))return e.textContent='Anda sudah punya antrean aktif di poli ini.';
  const n=db.kunjungan.filter(k=>k.tgl===today&&k.poli===poli).length+1,no=poli[0]+String(n).padStart(2,'0');
  db.kunjungan.push({id:db.seqK++,pid:user.pid,tgl:today,poli,keluhan:kel,no,status:'Menunggu',darurat:false,online:true,ttv:null,dx:'',terapi:''});logA('Ambil antrean online '+no);save();render();toast('Nomor antrean '+no+' diterbitkan')}};
V.riwayat=m=>{const ks=myK().filter(k=>k.status==='Selesai').sort((a,b)=>b.tgl.localeCompare(a.tgl)||b.id-a.id);
 m.innerHTML=`<h2>Riwayat kunjungan</h2><p class="sub">Hasil pemeriksaan Anda di puskesmas.</p>${ks.length?ks.map(k=>`<div class="box"><div class="top" style="margin-bottom:6px"><b>${fmt(new Date(k.tgl+'T00:00'))}</b><span class="tag Selesai">Poli ${k.poli} · ${k.no}</span></div>
 <div class="dx"><span>Keluhan</span><b>${esc(k.keluhan)}</b></div><div class="dx"><span>Diagnosis</span><b>${esc(k.dx||'-')}</b></div>
 ${k.ttv?`<div class="vit" style="margin:8px 0"><span>TD ${esc(k.ttv.td)}</span><span>Suhu ${esc(k.ttv.suhu)}°C</span><span>BB ${esc(k.ttv.bb)} kg</span><span>Nadi ${esc(k.ttv.nadi)}/mnt</span></div>`:''}
 <p class="sub" style="margin:6px 0 0">${esc(k.terapi||'')}</p></div>`).join(''):'<div class="box"><p class="empty">Belum ada riwayat kunjungan.</p></div>'}`};
V.datasaya=m=>{const p=myP();
 m.innerHTML=`<h2>Data saya</h2><p class="sub">Nomor pasien ${esc(p.id)}. Data identitas diubah lewat petugas.</p>
 <div class="box"><h3>Identitas</h3><div class="dx"><span>Nama</span><b>${esc(p.nama)}</b></div><div class="dx"><span>NIK</span><b>${esc(p.nik.slice(0,6))}••••••${esc(p.nik.slice(-4))}</b></div><div class="dx"><span>Lahir</span><b>${esc(p.lahir)} (${umur(p.lahir)} th)</b></div><div class="dx"><span>Jenis kelamin</span><b>${p.jk==='L'?'Laki-laki':'Perempuan'}</b></div></div>
 <div class="box"><h3>Kontak dan kesehatan</h3><label for="d1">Alamat</label><input id="d1" value="${esc(p.alamat)}"><div class="row"><div><label for="d2">No. HP</label><input id="d2" value="${esc(p.telp)}"></div><div><label for="d3">No. BPJS</label><input id="d3" value="${esc(p.bpjs)}"></div></div>
 <label for="d4">Alergi obat</label><input id="d4" value="${esc(p.alergi)}" placeholder="Kosongkan bila tidak ada"><p><button class="btn" id="ds">Simpan data</button></p></div>
 <div class="box"><h3>Tampilan</h3><label for="th">Tema</label><select id="th"><option value="auto">Ikuti perangkat</option><option value="light">Terang</option><option value="dark">Gelap</option></select></div>`;
 $('th').value=S.get('simpus_theme')||'auto';$('th').onchange=e=>setTheme(e.target.value);
 $('ds').onclick=()=>{Object.assign(p,{alamat:$('d1').value.trim(),telp:$('d2').value.trim(),bpjs:$('d3').value.trim(),alergi:$('d4').value.trim()});logA('Ubah data pasien sendiri');save();toast('Data disimpan')}};
V.info=m=>{const c=db.cfg;m.innerHTML=`<h2>Info puskesmas</h2><p class="sub">Layanan dan jam buka.</p><div class="box"><h3>${esc(c.nama)}</h3><div class="dx"><span>Alamat</span><b>${esc(c.alamat)}</b></div><div class="dx"><span>Jam layanan</span><b>${esc(c.jam)}</b></div><div class="dx"><span>Poli</span><b>${POLI.join(', ')}</b></div></div>
 <div class="box"><h3>Antrean hari ini</h3>${POLI.map(po=>{const l=db.kunjungan.filter(k=>k.tgl===today&&k.poli===po);return `<div class="dx"><span>Poli ${po}</span><b>${l.filter(k=>k.status==='Menunggu').length} menunggu · ${l.filter(k=>k.status==='Selesai').length} selesai</b></div>`}).join('')}</div>
 <div class="box"><h3>Ganti kata sandi</h3><div class="row"><div><label for="p1">Sandi saat ini</label><input id="p1" type="password" autocomplete="current-password"></div><div><label for="p2">Sandi baru</label><input id="p2" type="password" autocomplete="new-password"></div></div><div class="err" id="pe"></div><p><button class="btn" id="sw">Ganti kata sandi</button></p></div>`;
 $('sw').onclick=async()=>{const e=$('pe');if(!await verify(user,$('p1').value))return e.textContent='Sandi saat ini salah.';if(!pwOk($('p2').value))return e.textContent='Sandi baru minimal 8 karakter dengan huruf dan angka.';user.h=await hash($('p2').value);logA('Ganti kata sandi');save();e.textContent='';$('p1').value=$('p2').value='';toast('Kata sandi diganti')}};
V.pengaturan=m=>{const c=db.cfg;
 m.innerHTML=`<h2>Pengaturan</h2><p class="sub">Identitas puskesmas dan cadangan data.</p>
 <div class="box"><h3>Identitas puskesmas</h3><div class="row"><div><label for="c1">Nama puskesmas</label><input id="c1" value="${esc(c.nama)}"></div><div><label for="c2">Jam layanan</label><input id="c2" value="${esc(c.jam)}"></div></div><label for="c3">Alamat</label><input id="c3" value="${esc(c.alamat)}"><p><button class="btn" id="c4">Simpan pengaturan</button></p></div>
 <div class="box"><h3>Pengumuman internal</h3><p class="sub">Tampil di dashboard semua pengguna. Kosongkan teks lalu simpan untuk menghapus.</p><textarea id="it" rows="2" aria-label="Teks pengumuman">${esc((db.info||{}).teks)}</textarea><p><button class="btn" id="i1">Simpan pengumuman</button></p></div>
 <div class="box"><h3>Cadangan dan pemulihan data</h3><p class="sub">Teks cadangan memuat data pasien dan akun. Simpan di tempat aman dan jangan dibagikan.</p><textarea id="bk" rows="5" aria-label="Teks cadangan"></textarea><div class="err" id="be"></div><p><button class="btn alt" id="b1">Buat cadangan</button> <button class="btn" id="b2">Pulihkan dari teks</button></p></div>`;
 $('c4').onclick=()=>{db.cfg={nama:$('c1').value.trim()||c.nama,jam:$('c2').value.trim(),alamat:$('c3').value.trim()};logA('Ubah pengaturan puskesmas');render();toast('Pengaturan disimpan')};
 $('i1').onclick=()=>{const t=$('it').value.trim();db.info={teks:t,t:t?'Diumumkan '+fmt(new Date())+' oleh '+user.nama:''};logA(t?'Pasang pengumuman':'Hapus pengumuman');toast(t?'Pengumuman dipasang':'Pengumuman dihapus')};
 $('b1').onclick=async()=>{$('bk').value=JSON.stringify(db);logA('Buat cadangan data');try{await navigator.clipboard.writeText($('bk').value);toast('Cadangan dibuat dan disalin')}catch(e){toast('Cadangan dibuat. Salin teks secara manual.')}};
 $('b2').onclick=async()=>{let d;try{d=JSON.parse($('bk').value);if(!Array.isArray(d.pasien)||!Array.isArray(d.kunjungan)||!Array.isArray(d.users))throw 0}catch(e){return $('be').textContent='Teks cadangan tidak valid. Tempel teks cadangan lengkap.'}
  if(!d.users.some(u=>u.u===user.u&&u.role==='admin'&&u.status==='Aktif'))return $('be').textContent='Cadangan harus memuat akun admin Anda yang masih aktif.';
  if(!await dlg('Data saat ini akan diganti dengan cadangan. Lanjutkan?',{ok:'Pulihkan'}))return;
  db=d;db.obat=db.obat||[];db.log=db.log||[];db.seqO=db.seqO||99;db.cfg=db.cfg||CFG;user=db.users.find(x=>x.u===user.u);logA('Pulihkan data dari cadangan');render();toast('Data dipulihkan')};
};
(async()=>{
 if(!db.users){const mk=async(u,pw,nama,role)=>({u,h:await hash(pw),nama,role,status:'Aktif',dibuat:today,login:''});
  db.users=[await mk('admin','admin123','Administrator Puskesmas','admin'),await mk('petugas','petugas123','Sari Wulandari','petugas'),await mk('dokter','dokter123','dr. Rina Lestari','dokter')];save()}
 if(!db.users.some(u=>u.role==='pasien')){db.users.push({u:'siti',h:await hash('pasien123'),nama:'Siti Aminah',role:'pasien',pid:'P001',status:'Aktif',dibuat:today,login:''});save()}
 setTheme(S.get('simpus_theme')||'auto');const su=S.get('simpus_user');user=db.users.find(x=>x.u===su&&x.status==='Aktif')||null;render();
})();
</script>
</body>
</html>
